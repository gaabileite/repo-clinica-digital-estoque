name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: API e2e (sem banco)
        run: pnpm --dir apps/api test:e2e
      - name: Contrato OpenAPI e cliente em sincronia
        run: |
          cp .env.example .env
          pnpm api:check
      - name: Build do remote
        run: pnpm --dir apps/web build
