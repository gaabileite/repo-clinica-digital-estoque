name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: estoque_test
          POSTGRES_USER: estoque
          POSTGRES_PASSWORD: estoque_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estoque -d estoque_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://estoque:estoque_ci_password@localhost:5432/estoque_test?schema=public
      TEST_DATABASE_URL: postgresql://estoque:estoque_ci_password@localhost:5432/estoque_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations e seed no banco de teste
        run: |
          pnpm --dir apps/api exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm --dir apps/api exec node prisma/seed.mjs
      - name: API e2e (com banco)
        run: pnpm --dir apps/api test:e2e
      - name: Contrato OpenAPI e cliente em sincronia
        run: |
          cp .env.example .env
          pnpm api:check
      - name: Build do remote
        run: pnpm --dir apps/web build

      - name: Instalar Chromium para acessibilidade
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Verificar acessibilidade
        run: pnpm --dir apps/web exec playwright test